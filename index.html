        <button data-view="home" class="active">Beranda</button>
        <button data-view="products">Produk</button>
        <button data-view="how">Tentang</button>

        <div class="search-mini"><svg><use href="#i-search"></use></svg><input id="headerSearch" placeholder="Cari produk..."></div>

        <button id="mobileMenu" class="icon-btn mobile-only" aria-label="Buka menu"><svg><use href="#i-menu"></use></svg></button>
